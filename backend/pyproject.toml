[project]
name = "invoiceiq-backend"
version = "0.1.0"
description = "InvoiceIQ API: LangGraph invoice extraction, guarded Text-to-SQL analytics, guardrails and evals"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langgraph>=1.2.20",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "sqlalchemy>=2.1.8",
    "sqlglot>=30.30.0",
]

[project.optional-dependencies]
openai = [
    "langchain-openai>=1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::SyntaxWarning", "ignore::DeprecationWarning:google.*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["BLE001"]
